<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="IBM Plex Sans Arabic, Segoe UI, Tahoma, sans-serif" direction="rtl">
<title>رسم أعمدة لنسبة مستخدمي الإنترنت في خمس دول عام 2022 بمحور رأسي يبدأ من 90 لا من الصفر، فيبدو عمود السعودية أطول من عمود ألمانيا بنحو ستة أضعاف</title>
<rect width="780" height="500" fill="#ffffff"/>
<text x="750" y="42" text-anchor="start" font-size="28" font-weight="700" fill="#102a43">المملكة تتقدّم بفارق شاسع في استخدام الإنترنت</text>
<text x="750" y="72" text-anchor="start" font-size="16" fill="#be123c">نسبة مستخدمي الإنترنت من السكان، 2022</text>
<text x="52" y="404" text-anchor="start" font-size="12" fill="#94a3b8">90</text><text x="52" y="264" text-anchor="start" font-size="12" fill="#94a3b8">95</text><text x="52" y="124" text-anchor="start" font-size="12" fill="#94a3b8">100</text><rect x="620" y="120.0" width="80" height="280.0" fill="#0f766e"/><text x="660" y="110.0" text-anchor="middle" font-size="16" font-weight="700" fill="#102a43">100.0%</text><text x="660" y="424" text-anchor="middle" font-size="14" fill="#334155">السعودية</text><rect x="495" y="198.4" width="80" height="201.6" fill="#94a3b8"/><text x="535" y="188.4" text-anchor="middle" font-size="16" font-weight="700" fill="#102a43">97.2%</text><text x="535" y="424" text-anchor="middle" font-size="14" fill="#334155">كوريا الجنوبية</text><rect x="370" y="246.0" width="80" height="154.0" fill="#94a3b8"/><text x="410" y="236.0" text-anchor="middle" font-size="16" font-weight="700" fill="#102a43">95.5%</text><text x="410" y="424" text-anchor="middle" font-size="14" fill="#334155">المملكة المتحدة</text><rect x="245" y="324.4" width="80" height="75.6" fill="#94a3b8"/><text x="285" y="314.4" text-anchor="middle" font-size="16" font-weight="700" fill="#102a43">92.7%</text><text x="285" y="424" text-anchor="middle" font-size="14" fill="#334155">الولايات المتحدة</text><rect x="120" y="355.2" width="80" height="44.8" fill="#94a3b8"/><text x="160" y="345.2" text-anchor="middle" font-size="16" font-weight="700" fill="#102a43">91.6%</text><text x="160" y="424" text-anchor="middle" font-size="14" fill="#334155">ألمانيا</text>
<line x1="70" x2="730" y1="400" y2="400" stroke="#334155"/>
<text x="750" y="486" text-anchor="start" font-size="12" fill="#64748b">المصدر: البيانات المفتوحة للبنك الدولي، 2022 · صحيفة المنبر (رسم تدريبي)</text>
</svg>
