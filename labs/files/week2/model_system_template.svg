<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="IBM Plex Sans Arabic, Segoe UI, Tahoma, sans-serif" direction="rtl">
<title>قالب مخطط النموذج والنظام: مدخل المستخدم، ثم الاسترجاع، ثم النموذج، ثم الأدوات، ثم الإنسان في الحلقة</title>
<rect width="900" height="360" fill="#ffffff"/>
<text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">مخطط النموذج والنظام: املأ كل صندوق أو اكتب «لا يوجد»</text>
<text x="450" y="78" text-anchor="middle" font-size="15" fill="#475569">النموذج صندوق واحد. كل ما عداه هو النظام المحيط به.</text>
<rect x="700" y="120" width="140" height="150" rx="12" fill="#e2e8f0" stroke="#334155"/><text x="770" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">مدخل المستخدم</text><rect x="540" y="120" width="140" height="150" rx="12" fill="#e0f2fe" stroke="#334155"/><text x="610" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">الاسترجاع</text><text x="610" y="174" text-anchor="middle" font-size="11.5" fill="#475569">من أين تأتي المعلومة؟</text><rect x="380" y="120" width="140" height="150" rx="12" fill="#ffe4e6" stroke="#334155"/><text x="450" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">النموذج</text><rect x="220" y="120" width="140" height="150" rx="12" fill="#fef3c7" stroke="#334155"/><text x="290" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">الأدوات</text><text x="290" y="174" text-anchor="middle" font-size="11.5" fill="#475569">ماذا يستطيع أن يفعل؟</text><rect x="60" y="120" width="140" height="150" rx="12" fill="#e6f4f1" stroke="#334155"/><text x="130" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">الإنسان في الحلقة</text><text x="130" y="174" text-anchor="middle" font-size="11.5" fill="#475569">من يوافق ومن يُسأل؟</text><text x="690" y="200" text-anchor="middle" font-size="26" fill="#334155">←</text><text x="530" y="200" text-anchor="middle" font-size="26" fill="#334155">←</text><text x="370" y="200" text-anchor="middle" font-size="26" fill="#334155">←</text><text x="210" y="200" text-anchor="middle" font-size="26" fill="#334155">←</text>
<text x="450" y="320" text-anchor="middle" font-size="15" fill="#475569">تحت كل صندوق: خطأ واحد قد يقع فيه. من أين جاء الخطأ: من النموذج أم من النظام؟</text>
</svg>
